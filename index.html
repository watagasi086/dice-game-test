
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダイスバトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="gameHeader" class="game-header setup-mode">
    <div class="header-inner">
      <div class="version">Ver. 1.5</div>
      <div id="setupHp" class="setup-hp">
        <div class="hp-label">
          <span>あなたの体力</span>
          <span id="setupHpText">100 / 100</span>
        </div>
        <div class="hp-track">
          <div id="setupHpBar" class="hp-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="setupScreen" class="screen">
      <h1>🎲 ダイスバトル</h1>
      <p class="description">技を購入して、サイコロの出目に装備しよう！</p>

      <div class="setup-layout">
        <section class="panel shop-panel">
          <h2>🛒 技ショップ</h2>
          <p class="small-note">技の購入には体力を使うよ！</p>
          <div id="shopList" class="shop-list"></div>
        </section>

        <section class="panel equipment-panel">
          <h2>🎲 サイコロの装備</h2>
          <p class="small-note">所持技を選んでから、装備したい枠を押してな。</p>
          <div id="battleSlots" class="slots"></div>

          <div class="owned-area">
            <h2>🎒 所持技</h2>
            <p id="selectedSkillText" class="selected-text">装備したい技を選択してな</p>
            <div id="ownedList" class="owned-list"></div>
          </div>

          <button id="startButton" class="primary-button">バトル開始！</button>
        </section>
      </div>
    </section>

    <section id="battleScreen" class="screen hidden">
      <h1>⚔️ バトル！</h1>

      <div class="battle-hp-area">
        <div class="fighter">
          <div class="fighter-name">あなた</div>
          <div id="playerHpText" class="battle-hp-text">100 / 100 HP</div>
          <div class="hp-track">
            <div id="playerHpBar" class="hp-fill"></div>
          </div>
        </div>

        <div class="fighter">
          <div class="fighter-name">相手</div>
          <div id="enemyHpText" class="battle-hp-text">100 / 100 HP</div>
          <div class="hp-track">
            <div id="enemyHpBar" class="hp-fill enemy-fill"></div>
          </div>
        </div>
      </div>

      <div class="battle-board">
        <div class="dice-card">
          <p>あなたの出目</p>
          <div id="playerDie" class="die">🎲</div>
          <div id="playerAction" class="action-text">準備OK！</div>
        </div>
        <div class="dice-card">
          <p>相手の出目</p>
          <div id="enemyDie" class="die">🎲</div>
          <div id="enemyAction" class="action-text">相手を待っている…</div>
        </div>
      </div>

      <div class="panel battle-skills-panel">
        <h2>あなたのサイコロ</h2>
        <div id="battleSkillDisplay" class="battle-skill-display"></div>
      </div>

      <button id="rollButton" class="primary-button roll-button">サイコロを振る！</button>

      <div class="panel log-panel">
        <h2>📜 バトルログ</h2>
        <div id="battleLog" class="battle-log">バトル開始！サイコロを振ろう。</div>
      </div>

      <button id="backButton" class="secondary-button">準備画面に戻る</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
