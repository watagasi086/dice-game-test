
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="gameHeader" class="game-header setup-mode">
    <div class="header-inner">
      <div class="version">Ver. 1.8.1</div>

      <div id="setupHp" class="setup-hp">
        <div class="hp-label">
          <span>あなたの体力</span>
          <span id="setupHpText">100 / 100</span>
        </div>
        <div class="hp-track">
          <div id="setupHpBar" class="hp-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="setupScreen">
      <h1>🎲 Dice Battle</h1>
      <p class="description">
        技を購入してサイコロにセットしよう！<br>
        体力を使って技を購入するぞ。
      </p>

      <div class="setup-layout">
        <section class="panel">
          <h2>🛒 技ショップ</h2>
          <p class="subtext">購入費用は体力から引かれます。</p>
          <div id="shopList"></div>
        </section>

        <section class="panel">
          <h2>⚔️ 技のセット</h2>
          <p class="subtext">スロットを選んでから技を選択。</p>

          <div id="battleSlots" class="battle-slots"></div>

          <p id="selectedSkillText" class="selected-text">
            セットするスロットを選んでね。
          </p>

          <h3>📦 所持している技</h3>
          <div id="ownedList"></div>

          <button id="startButton" class="primary-button" disabled>
            バトル開始！
          </button>
        </section>
      </div>
    </section>

    <section id="battleScreen" class="hidden">
      <h1>⚔️ バトル！</h1>

      <div class="battle-status">
        <section class="fighter-card">
          <h2>あなた</h2>
          <div class="hp-label">
            <span>HP</span>
            <span id="playerHpText">100 / 100</span>
          </div>
          <div class="hp-track">
            <div id="playerHpBar" class="hp-fill"></div>
          </div>
          <div id="playerDie" class="die">?</div>
          <p>あなたのサイコロ</p>
        </section>

        <div class="vs">VS</div>

        <section class="fighter-card enemy-card">
          <h2>敵</h2>
          <div class="hp-label">
            <span>HP</span>
            <span id="enemyHpText">100 / 100</span>
          </div>
          <div class="hp-track">
            <div id="enemyHpBar" class="hp-fill enemy-fill"></div>
          </div>
          <div id="enemyDie" class="die">?</div>
          <p>敵のサイコロ</p>
        </section>
      </div>

      <section class="panel battle-skills-panel">
        <h2>今回の技</h2>
        <div id="battleSkillDisplay" class="battle-skill-display"></div>
      </section>

      <button id="rollButton" class="primary-button">
        🎲 サイコロを振る！
      </button>

      <section class="panel log-panel">
        <h2>📜 バトルログ</h2>
        <div id="battleLog" class="battle-log">
          バトル開始！
        </div>
      </section>

      <button id="backButton" class="secondary-button hidden">
        準備画面に戻る
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
