<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Battle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game">

    <!-- 上部の体力表示 -->
    <header class="top-hp">
      <div class="hp-title">あなたの体力</div>

      <div class="hp-number">
        <span id="setupHp">100</span>/100
      </div>

      <div class="hp-bar">
        <div id="setupHpBar"></div>
      </div>
    </header>


    <!-- 技のセット画面 -->
    <section id="setupScreen">

      <h1>🎲 技をセット</h1>

      <p class="guide" id="guide">
        所持技を選んでから、変更したいスロットを押してください。
      </p>

      <!-- 横並びレイアウト -->
      <div class="setup-layout">

        <!-- 左側：ショップ -->
        <div class="setup-left">

          <section class="panel">
            <h2>🛒 ショップ</h2>

            <p class="sub">
              技を購入すると体力を消費します。<br>
              購入した技は、所持数の範囲で装備できます。
            </p>

            <div id="shopList"></div>
          </section>

        </div>


        <!-- 右側：スロットと所持技 -->
        <div class="setup-right">

          <section class="panel">
            <h2>🎲 技スロット</h2>

            <p class="sub">
              サイコロの出目ごとに技を1つセットします。
            </p>

            <div id="slotList"></div>
          </section>


          <section class="panel">
            <h2>📦 所持技</h2>

            <p class="sub">
              技を選択してから、装備したいスロットを押してください。
            </p>

            <div id="ownedList"></div>
          </section>

        </div>

      </div>


      <button id="startButton" class="main-button">
        この構成でバトル開始
      </button>

    </section>



    <!-- バトル画面 -->
    <section id="battleScreen" class="hidden">

      <h1>⚔️ BATTLE</h1>


      <!-- HP表示 -->
      <section class="battle-status">

        <div class="fighter enemy">
          <h2>相手</h2>

          <div class="battle-hp">
            <div id="enemyHpBar"></div>
          </div>

          <b>
            <span id="enemyHp">100</span>/100
          </b>
        </div>


        <div class="fighter">
          <h2>あなた</h2>

          <div class="battle-hp">
            <div id="playerHpBar"></div>
          </div>

          <b>
            <span id="playerHp">100</span>/100
          </b>
        </div>

      </section>


      <!-- 自分のサイコロ構成 -->
      <section class="panel battle-loadout">

        <h2>🎲 あなたのサイコロ</h2>

        <div id="battleSlots"></div>

      </section>


      <!-- サイコロを振る -->
      <section class="dice-panel">

        <div id="dice" class="dice">?</div>

        <div id="battleSkill" class="battle-skill">
          サイコロを振ろう
        </div>

        <button id="rollButton" class="main-button">
          サイコロを振る
        </button>

        <p id="battleResult"></p>

      </section>


      <!-- バトルログ -->
      <section class="panel log-panel">

        <h2>📜 バトルログ</h2>

        <div id="log"></div>

      </section>


      <button id="backButton" class="sub-button">
        技構成に戻る
      </button>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
